name: CI

on: [push, pull_request]

jobs:
  test:
    name: Workspace Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build & GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev

      - name: Rustfmt Check (Workspace)
        run: cargo fmt --all -- --check

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit & Integration Tests
        run: cargo test --workspace

      - name: Hardware Simulation Suite (6 Scenarios)
        run: cargo test --manifest-path dm01-firmware/Cargo.toml --test simulation_suite -- --nocapture

      - name: Strict #![no_std] Bare-Metal Check
        run: cargo check --manifest-path dm01-firmware/Cargo.toml --no-default-features --lib

      - name: Verify Stock Containers (if blobs present)
        run: |
          if [ -f "blobs/firmware/dm01/TO7-DM01-K260521A-V6510C.Pack" ]; then
            cargo run --manifest-path dm01-firmware/Cargo.toml --bin toseven_pack -- verify "blobs/firmware/dm01/TO7-DM01-K260521A-V6510C.Pack"
          fi
          if [ -f "blobs/firmware/dm02/TO7-DM02-K260526-V6510C.Pack" ]; then
            cargo run --manifest-path dm01-firmware/Cargo.toml --bin toseven_pack -- verify "blobs/firmware/dm02/TO7-DM02-K260526-V6510C.Pack"
          fi
