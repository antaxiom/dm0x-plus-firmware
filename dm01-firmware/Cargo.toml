[package]
name = "dm01-firmware"
version = "0.3.0"
edition = "2021"
description = "Functionally identical Rust firmware recompilation and .Pack tooling for ToSeven DM01 & DM02 mid-drive motors (V6510C)"

[lib]
name = "dm01_firmware"
path = "src/lib.rs"

[[bin]]
name = "toseven_pack"
path = "src/bin/toseven_pack.rs"
required-features = ["std"]

[[bin]]
name = "dm01_firmware"
path = "src/bin/firmware.rs"
test = false
bench = false
required-features = ["embedded"]

[[bin]]
name = "dm02_firmware"
path = "src/bin/firmware_dm02.rs"
test = false
bench = false
required-features = ["embedded"]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = ["std"]
std = ["dep:libc"]
embedded = []



